include /home/ecs-user/Projects/shenleng/redirects/nginx_rewrite_rules.conf;

# ==========================================
# 1. API 服务 (api.finverse.top)
# ==========================================
server {
    server_name api.finverse.top;

    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v2/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.finverse.top-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.finverse.top-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ==========================================
# 2. Web 前端 (web.finverse.top)
# ==========================================
server {
    server_name web.finverse.top;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.finverse.top-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.finverse.top-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ==========================================
# 3. 申冷官网 (www.finverse.top) - HTTPS
# ==========================================
server {
    server_name www.finverse.top finverse.top;

    if ($new_uri_by_legacy_id) {
        return 301 https://www.finverse.top$new_uri_by_legacy_id;
    }

    if ($new_uri) {
        return 301 https://www.finverse.top$new_uri;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # 常见扫描入口直接拦截，避免落到应用层产生 200 软响应
    location ~* ^/(wp-|xmlrpc\.php|boaform|manager/html|actuator) {
        return 404;
    }

    location ~* \.(php|aspx?|jsp)$ {
        return 404;
    }

    # 媒体文件直接由 Nginx 服务（绕过 Next.js）
    location /media/ {
        alias /home/ecs-user/Projects/shenleng/persistence/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Next.js 静态资源
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 其他请求代理到 Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 50m;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/www.finverse.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.finverse.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# --- HTTP 跳转 ---
server {
    listen 80;
    server_name api.finverse.top;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name web.finverse.top;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name www.finverse.top finverse.top;

    if ($new_uri_by_legacy_id) {
        return 301 https://www.finverse.top$new_uri_by_legacy_id;
    }

    if ($new_uri) {
        return 301 https://www.finverse.top$new_uri;
    }

    return 301 https://www.finverse.top$request_uri;
}
