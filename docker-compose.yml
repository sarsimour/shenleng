services:
  web:
    container_name: shenleng-container
    # GH Actions 在 Runner 上 build 并 push 到 ACR；ECS 仅拉镜像运行
    image: crpi-magb6k3sv0c9s8ci.cn-shanghai.personal.cr.aliyuncs.com/sl-2026/slgw:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./persistence/sqlite:/app/database
      - ./persistence/media:/app/public/media
    environment:
      - NODE_ENV=production
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - DATABASE_URI=file:/app/database/payload.db
      - VERSECORE_API_BASE_URL=${VERSECORE_API_BASE_URL:-http://versecore-api:9000}
      - NEXT_PUBLIC_VERSECORE_APP_ID=${NEXT_PUBLIC_VERSECORE_APP_ID:-logistics-web}
      - NEXT_PUBLIC_LOGISTICS_CHATBOT_NAME=${NEXT_PUBLIC_LOGISTICS_CHATBOT_NAME:-申冷售前顾问}
      - NEXT_PUBLIC_LOGISTICS_CHATBOT_ID=${NEXT_PUBLIC_LOGISTICS_CHATBOT_ID}
      - PORT=3000
    networks:
      - slm-shared-net

# 共享网络供 web 与 versecore-api 通信。需要 ECS 上先创建：
#   docker network create slm-shared-net
#   docker network connect slm-shared-net versecore-api
networks:
  slm-shared-net:
    external: true
