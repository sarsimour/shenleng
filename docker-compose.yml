services:
  web:
    container_name: shenleng-container
    # 直接在 ECS 上构建（ECS 无法访问 github.com，所以源码由 GH Actions scp 上来后本地 build）
    build: .
    image: shenleng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./persistence/sqlite:/app/database
      - ./persistence/media:/app/public/media
    environment:
      - NODE_ENV=production
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - DATABASE_URI=file:/app/database/payload.db
      - VERSECORE_API_BASE_URL=${VERSECORE_API_BASE_URL:-http://versecore-api:9000}
      - PORT=3000
