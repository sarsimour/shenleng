name: Deploy Shenleng (Docker + Alibaba Cloud ACR)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  # 阿里云容器镜像服务 - 个人版实例
  ACR_REGISTRY: crpi-magb6k3sv0c9s8ci.cn-shanghai.personal.cr.aliyuncs.com
  IMAGE_NAME: crpi-magb6k3sv0c9s8ci.cn-shanghai.personal.cr.aliyuncs.com/sl-2026/slgw:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 登录阿里云容器镜像服务 (ACR)
      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 2. 构建并推送 Docker 镜像到 ACR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}

      # 3. 传输配置文件到服务器
      - name: Copy configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          timeout: 10m
          source: "docker-compose.yml,nginx.conf"
          target: "/home/${{ secrets.ECS_USER }}/Projects/shenleng"

      # 4. 在服务器上部署
      - name: Deploy on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          timeout: 20m
          script: |
            set -e
            
            export PAYLOAD_SECRET="${{ secrets.PAYLOAD_SECRET }}"
            export IMAGE_NAME="${{ env.IMAGE_NAME }}"
            export ACR_REGISTRY="${{ env.ACR_REGISTRY }}"
            
            PROJECT_DIR="/home/${{ secrets.ECS_USER }}/Projects/shenleng"
            cd "$PROJECT_DIR"
            
            echo "📦 Stopping existing container..."
            docker compose down || true
            
            echo "📁 Preparing directories..."
            mkdir -p persistence/sqlite
            mkdir -p persistence/media
            chmod -R 777 persistence/
            
            echo "🔐 Logging into Alibaba Cloud ACR..."
            echo "${{ secrets.ACR_PASSWORD }}" | docker login "$ACR_REGISTRY" -u "${{ secrets.ACR_USERNAME }}" --password-stdin
            
            echo "📥 Pulling latest image..."
            docker pull "$IMAGE_NAME"
            
            echo "🚀 Starting container..."
            echo "PAYLOAD_SECRET=$PAYLOAD_SECRET" > .env
            docker compose up -d --remove-orphans

            echo "🧱 Syncing database schema..."
            docker compose exec -T web sh -c "cd /app && npm run schema:sync"

            echo "🧪 Running post-deploy smoke test..."
            docker compose exec -T -e SMOKE_BASE_URL="http://127.0.0.1:3000" web sh -c "cd /app && npm run smoke:post-deploy"
            
            echo "🔄 Reloading Nginx..."
            sudo nginx -s reload || true
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Deployment complete!"
