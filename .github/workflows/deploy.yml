name: Deploy Shenleng (Build on ECS)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 在 Runner 上打包源码（排除 node_modules / .next / .git 等）
      #    ECS 无法访问 github.com，所以由 Actions 把源码送过去再本地 build
      - name: Create source tarball
        run: |
          tar \
            --exclude='./node_modules' \
            --exclude='./.next' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./conductor' \
            --exclude='./tests' \
            --exclude='./test-results' \
            --exclude='./persistence' \
            --exclude='./directus_data' \
            --exclude='./data' \
            --exclude='./output' \
            --exclude='./database' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./payload.db' \
            --exclude='./payload-test.db' \
            --exclude='./.pnpm-store' \
            --exclude='./tsconfig.tsbuildinfo' \
            --exclude='./shenleng-source.tar.gz' \
            -czf /tmp/shenleng-source.tar.gz .
          mv /tmp/shenleng-source.tar.gz ./shenleng-source.tar.gz
          ls -lh ./shenleng-source.tar.gz

      # 2. 传输源码 tarball 到服务器 (scp-action 在容器里跑，source 必须在 workspace 下)
      - name: Upload source to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          timeout: 10m
          source: "shenleng-source.tar.gz"
          target: "/tmp/"

      # 3. 在 ECS 上解压并构建
      - name: Build and deploy on ECS
        uses: appleboy/ssh-action@v1.0.3
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          VERSECORE_API_BASE_URL: ${{ secrets.VERSECORE_API_BASE_URL }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          timeout: 20m
          command_timeout: 30m
          envs: PAYLOAD_SECRET,VERSECORE_API_BASE_URL
          script: |
            set -e

            : "${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}"

            PROJECT_DIR="/home/${{ secrets.ECS_USER }}/Projects/shenleng"
            mkdir -p "$PROJECT_DIR"
            cd "$PROJECT_DIR"

            echo "📁 Ensuring persistence directories..."
            mkdir -p persistence/sqlite persistence/media
            chmod -R 777 persistence/

            echo "📦 Extracting source (preserves persistence/ since it's not in tarball)..."
            # 排除 persistence/、.env 之类的运行时数据
            tar -xzf /tmp/shenleng-source.tar.gz -C "$PROJECT_DIR"
            rm -f /tmp/shenleng-source.tar.gz

            echo "🧹 Reclaiming Docker disk space before build..."
            docker container prune -f || true
            docker image prune -f || true
            docker builder prune -af || true
            df -h /

            echo "🧾 Writing runtime environment..."
            if [ -z "$VERSECORE_API_BASE_URL" ]; then
              VERSECORE_API_BASE_URL="http://versecore-api:9000"
            fi

            umask 077
            cat > .env.tmp <<EOF
            PAYLOAD_SECRET=$PAYLOAD_SECRET
            VERSECORE_API_BASE_URL=$VERSECORE_API_BASE_URL
            EOF
            mv .env.tmp .env

            echo "🔨 Building image on ECS..."
            docker compose build web

            echo "🚀 Recreating container with new image..."
            docker compose up -d --remove-orphans --force-recreate

            echo "🧱 Syncing database schema..."
            docker compose exec -T web sh -c "cd /app && npm run schema:sync"

            echo "🧪 Running post-deploy smoke test..."
            docker compose exec -T -e SMOKE_BASE_URL="http://127.0.0.1:3000" web sh -c "cd /app && npm run smoke:post-deploy"

            echo "🔄 Reloading Nginx..."
            sudo nginx -s reload || true

            echo "🧹 Final dangling image cleanup..."
            docker image prune -f || true
            df -h /

            echo "✅ Deployment complete!"
