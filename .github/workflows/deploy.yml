name: Deploy Shenleng Web (R2 Pull Artifact)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: shenleng-web-r2-artifact
  cancel-in-progress: false

permissions:
  contents: read

env:
  ARTIFACT_NAME: shenleng-web-standalone.tgz

jobs:
  build-and-publish-r2:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enforce light deploy policy
        run: bash scripts/check-light-deploy-policy.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies on GitHub runner
        run: npm ci --legacy-peer-deps

      - name: Build standalone artifact on GitHub runner
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PAYLOAD_SECRET: build_secret_placeholder
          DATABASE_URI: file:./payload-build.db
          PAYLOAD_CONFIG_PATH: src/payload.config.ts
          NEXT_PUBLIC_VERSECORE_APP_ID: ${{ secrets.NEXT_PUBLIC_VERSECORE_APP_ID || 'logistics-web' }}
          NEXT_PUBLIC_LOGISTICS_CHATBOT_NAME: ${{ secrets.NEXT_PUBLIC_LOGISTICS_CHATBOT_NAME || '申冷售前顾问' }}
          NEXT_PUBLIC_LOGISTICS_CHATBOT_ID: ${{ secrets.NEXT_PUBLIC_LOGISTICS_CHATBOT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail

          : "${NEXT_PUBLIC_LOGISTICS_CHATBOT_ID:?NEXT_PUBLIC_LOGISTICS_CHATBOT_ID is required}"
          : "${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}"

          echo "=== Build environment ==="
          node -v
          npm -v
          df -h /
          free -h

          npm run generate:importmap
          /usr/bin/time -v npm run build

          rm -rf artifact-root
          mkdir -p artifact-root/.next
          rsync -a .next/standalone/ artifact-root/
          rsync -a .next/static/ artifact-root/.next/static/
          rsync -a --exclude media --exclude images public/ artifact-root/public/
          mkdir -p artifact-root/src/app
          rsync -a src/payload.config.ts src/payload-types.ts artifact-root/src/
          rsync -a src/collections artifact-root/src/
          rsync -a src/lib artifact-root/src/
          rsync -a src/scripts artifact-root/src/
          rsync -a src/app/sitemap.ts artifact-root/src/app/
          if [ -d redirects ]; then
            rsync -a redirects/ artifact-root/redirects/
          fi

          tar -C artifact-root -czf "$ARTIFACT_NAME" .
          ls -lh "$ARTIFACT_NAME"
          echo "artifact_size=$(du -h "$ARTIFACT_NAME" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish artifact manifest to Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PREFIX: ${{ secrets.CLOUDFLARE_R2_PREFIX || 'shenleng/web' }}
          CLOUDFLARE_R2_PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail

          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
          : "${CLOUDFLARE_R2_BUCKET_NAME:?CLOUDFLARE_R2_BUCKET_NAME is required}"
          : "${CLOUDFLARE_R2_PUBLIC_BASE_URL:?CLOUDFLARE_R2_PUBLIC_BASE_URL is required}"

          python scripts/publish-r2-artifact.py --artifact "$ARTIFACT_NAME" > r2-publish-result.json
          cat r2-publish-result.json

          {
            echo "### R2 artifact"
            echo
            jq -r '"- version: `\(.version)`", "- manifest: \(.manifestUrl)", "- artifact size: \(.size) bytes"' r2-publish-result.json
          } >> "$GITHUB_STEP_SUMMARY"
