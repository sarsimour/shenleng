name: Deploy Artifact Candidate

on:
  workflow_dispatch:

env:
  ARTIFACT_NAME: shenleng-artifact-candidate.tgz

jobs:
  build-and-test-candidate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build standalone artifact
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PAYLOAD_SECRET: build_secret_placeholder
          DATABASE_URI: file:./payload-build.db
          PAYLOAD_CONFIG_PATH: src/payload.config.ts
          NEXT_PUBLIC_VERSECORE_APP_ID: ${{ secrets.NEXT_PUBLIC_VERSECORE_APP_ID || 'logistics-web' }}
          NEXT_PUBLIC_LOGISTICS_CHATBOT_NAME: ${{ secrets.NEXT_PUBLIC_LOGISTICS_CHATBOT_NAME || '申冷售前顾问' }}
          NEXT_PUBLIC_LOGISTICS_CHATBOT_ID: ${{ secrets.NEXT_PUBLIC_LOGISTICS_CHATBOT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail

          : "${NEXT_PUBLIC_LOGISTICS_CHATBOT_ID:?NEXT_PUBLIC_LOGISTICS_CHATBOT_ID is required}"
          : "${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}"

          echo "=== Build environment ==="
          node -v
          npm -v
          df -h /
          free -h

          npm run generate:importmap
          /usr/bin/time -v npm run build

          rm -rf artifact-root
          mkdir -p artifact-root/.next
          rsync -a .next/standalone/ artifact-root/
          rsync -a .next/static/ artifact-root/.next/static/
          rsync -a --exclude media --exclude images public/ artifact-root/public/
          mkdir -p artifact-root/src/app
          rsync -a src/payload.config.ts src/payload-types.ts artifact-root/src/
          rsync -a src/collections artifact-root/src/
          rsync -a src/lib artifact-root/src/
          rsync -a src/scripts artifact-root/src/
          rsync -a src/app/sitemap.ts artifact-root/src/app/
          if [ -d redirects ]; then
            rsync -a redirects/ artifact-root/redirects/
          fi

          echo "=== Artifact source sizes ==="
          du -sh .next/standalone .next/static public artifact-root
          find artifact-root -maxdepth 2 -type d | sort | sed -n '1,80p'

          tar -C artifact-root -czf "$ARTIFACT_NAME" .

          echo "=== Packaged artifact ==="
          ls -lh "$ARTIFACT_NAME"
          bytes=$(stat -c%s "$ARTIFACT_NAME")
          echo "artifact_bytes=$bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact_size=$(du -h "$ARTIFACT_NAME" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact package to ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -euo pipefail

          : "${ECS_HOST:?ECS_HOST is required}"
          : "${ECS_USER:?ECS_USER is required}"
          : "${ECS_SSH_KEY:?ECS_SSH_KEY is required}"

          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/shenleng-ecs
          chmod 600 ~/.ssh/shenleng-ecs

          ssh_opts=(
            -i ~/.ssh/shenleng-ecs
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
          )
          remote_dir="/home/$ECS_USER/Projects/shenleng/artifact-uploads/${GITHUB_RUN_ID}"

          echo "=== Native SSH preflight ==="
          ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" "mkdir -p '$remote_dir' && df -h / && free -h"

          echo "=== Native SCP upload ==="
          ls -lh "$ARTIFACT_NAME"
          /usr/bin/time -v timeout 8m scp -O "${ssh_opts[@]}" \
            "$ARTIFACT_NAME" \
            scripts/deploy-web-light.sh \
            "$ECS_USER@$ECS_HOST:$remote_dir/"

          echo "=== Remote upload verification ==="
          ssh "${ssh_opts[@]}" "$ECS_USER@$ECS_HOST" "mkdir -p '/home/$ECS_USER/Projects/shenleng/scripts' && cp '$remote_dir/deploy-web-light.sh' '/home/$ECS_USER/Projects/shenleng/scripts/deploy-web-light.sh' && chmod +x '/home/$ECS_USER/Projects/shenleng/scripts/deploy-web-light.sh' && ls -lh '$remote_dir/$ARTIFACT_NAME' && du -sh '$remote_dir'"

      - name: Validate candidate with light deploy script
        uses: appleboy/ssh-action@v1.0.3
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          VERSECORE_API_BASE_URL: ${{ secrets.VERSECORE_API_BASE_URL }}
          NEXT_PUBLIC_VERSECORE_APP_ID: ${{ secrets.NEXT_PUBLIC_VERSECORE_APP_ID }}
          NEXT_PUBLIC_LOGISTICS_CHATBOT_NAME: ${{ secrets.NEXT_PUBLIC_LOGISTICS_CHATBOT_NAME }}
          NEXT_PUBLIC_LOGISTICS_CHATBOT_ID: ${{ secrets.NEXT_PUBLIC_LOGISTICS_CHATBOT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          REQUEST_LOG_SHARED_SECRET: ${{ secrets.REQUEST_LOG_SHARED_SECRET }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          timeout: 10m
          command_timeout: 15m
          envs: RUN_ID,ARTIFACT_NAME,PAYLOAD_SECRET,VERSECORE_API_BASE_URL,NEXT_PUBLIC_VERSECORE_APP_ID,NEXT_PUBLIC_LOGISTICS_CHATBOT_NAME,NEXT_PUBLIC_LOGISTICS_CHATBOT_ID,NEXT_PUBLIC_SITE_URL,REQUEST_LOG_SHARED_SECRET
          script: |
            set -euo pipefail

            : "${RUN_ID:?RUN_ID is required}"
            : "${ARTIFACT_NAME:?ARTIFACT_NAME is required}"
            : "${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}"
            : "${NEXT_PUBLIC_LOGISTICS_CHATBOT_ID:?NEXT_PUBLIC_LOGISTICS_CHATBOT_ID is required}"
            : "${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}"

            PROJECT_DIR="/home/${USER}/Projects/shenleng"
            UPLOAD_DIR="$PROJECT_DIR/artifact-uploads/$RUN_ID"

            if [ -z "${VERSECORE_API_BASE_URL:-}" ]; then
              VERSECORE_API_BASE_URL="http://127.0.0.1:9100"
            fi
            if [ -z "${NEXT_PUBLIC_VERSECORE_APP_ID:-}" ]; then
              NEXT_PUBLIC_VERSECORE_APP_ID="logistics-web"
            fi
            if [ -z "${NEXT_PUBLIC_LOGISTICS_CHATBOT_NAME:-}" ]; then
              NEXT_PUBLIC_LOGISTICS_CHATBOT_NAME="申冷售前顾问"
            fi

            test -s "$UPLOAD_DIR/$ARTIFACT_NAME"
            cd "$PROJECT_DIR"
            PROJECT_DIR="$PROJECT_DIR" \
              PUBLIC_URL="$NEXT_PUBLIC_SITE_URL" \
              WEB_DEPLOY_VERSECORE_API_BASE_URL="$VERSECORE_API_BASE_URL" \
              PAYLOAD_SECRET="$PAYLOAD_SECRET" \
              NEXT_PUBLIC_VERSECORE_APP_ID="$NEXT_PUBLIC_VERSECORE_APP_ID" \
              NEXT_PUBLIC_LOGISTICS_CHATBOT_NAME="$NEXT_PUBLIC_LOGISTICS_CHATBOT_NAME" \
              NEXT_PUBLIC_LOGISTICS_CHATBOT_ID="$NEXT_PUBLIC_LOGISTICS_CHATBOT_ID" \
              NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
              REQUEST_LOG_SHARED_SECRET="${REQUEST_LOG_SHARED_SECRET:-}" \
              scripts/deploy-web-light.sh \
                --artifact "$UPLOAD_DIR/$ARTIFACT_NAME" \
                --candidate-only \
                --skip-public-precheck
