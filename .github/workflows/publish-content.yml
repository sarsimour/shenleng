name: Publish Shenleng Content

on:
  workflow_dispatch:
    inputs:
      content_file:
        description: "Repository path to the content JSON spec"
        required: true
        type: string
      site_url:
        description: "Target site URL"
        required: true
        default: "https://shenleng.roinland.com"
        type: string

concurrency:
  group: shenleng-content-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install publisher dependencies on GitHub runner
        run: npm ci --legacy-peer-deps

      - name: Build content package
        env:
          CONTENT_FILE: ${{ inputs.content_file }}
          SITE_URL: ${{ inputs.site_url }}
        run: |
          set -euo pipefail

          test -f "$CONTENT_FILE"

          echo "content_file=$CONTENT_FILE"
          echo "site_url=$SITE_URL"

          npm run content:publish -- --dry-run --site "$SITE_URL" "$CONTENT_FILE"
          npm run content:publish -- --package-output "$RUNNER_TEMP/content-package.json" --site "$SITE_URL" "$CONTENT_FILE"

      - name: Upload content package to R2
        id: package
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
          CLOUDFLARE_R2_CONTENT_PREFIX: shenleng/content
        run: python scripts/publish-r2-content-package.py --package "$RUNNER_TEMP/content-package.json"

      - name: Verify R2 content manifest
        env:
          PACKAGE_URL: ${{ steps.package.outputs.package_url }}
          PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail

          : "${PACKAGE_URL:?package_url output is required}"
          : "${PACKAGE_SHA256:?sha256 output is required}"

          echo "package_url=$PACKAGE_URL"
          echo "package_sha256=$PACKAGE_SHA256"
          curl -fsS --connect-timeout 10 --max-time 60 "$PACKAGE_URL" -o "$RUNNER_TEMP/published-content-package.json"
          actual_sha="$(sha256sum "$RUNNER_TEMP/published-content-package.json" | awk '{print $1}')"
          echo "downloaded_package_sha256=$actual_sha"
          test "$actual_sha" = "$PACKAGE_SHA256"
