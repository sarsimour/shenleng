name: Publish Shenleng Content

on:
  workflow_dispatch:
    inputs:
      content_file:
        description: "Repository path to the content JSON spec"
        required: true
        type: string
      site_url:
        description: "Target site URL"
        required: true
        default: "https://shenleng.roinland.com"
        type: string

concurrency:
  group: shenleng-content-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install publisher dependencies on GitHub runner
        run: npm ci --legacy-peer-deps

      - name: Build content package
        env:
          CONTENT_FILE: ${{ inputs.content_file }}
          SITE_URL: ${{ inputs.site_url }}
        run: |
          set -euo pipefail

          test -f "$CONTENT_FILE"

          echo "content_file=$CONTENT_FILE"
          echo "site_url=$SITE_URL"

          npm run content:publish -- --dry-run --site "$SITE_URL" "$CONTENT_FILE"
          npm run content:publish -- --package-output "$RUNNER_TEMP/content-package.json" --site "$SITE_URL" "$CONTENT_FILE"

      - name: Upload content package to R2
        id: package
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
          CLOUDFLARE_R2_CONTENT_PREFIX: shenleng/content
        run: python scripts/publish-r2-content-package.py --package "$RUNNER_TEMP/content-package.json"

      - name: Trigger server-side content publish
        env:
          CONTENT_PUBLISH_TOKEN: ${{ secrets.CONTENT_PUBLISH_TOKEN }}
          PACKAGE_URL: ${{ steps.package.outputs.package_url }}
          PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
          SITE_URL: ${{ inputs.site_url }}
        run: |
          set -euo pipefail

          : "${CONTENT_PUBLISH_TOKEN:?CONTENT_PUBLISH_TOKEN secret is required}"
          : "${PACKAGE_URL:?package_url output is required}"
          : "${PACKAGE_SHA256:?sha256 output is required}"

          echo "package_url=$PACKAGE_URL"
          echo "package_sha256=$PACKAGE_SHA256"
          echo "token_length=${#CONTENT_PUBLISH_TOKEN}"

          body="$(node -e 'process.stdout.write(JSON.stringify({packageUrl: process.env.PACKAGE_URL, sha256: process.env.PACKAGE_SHA256}))')"
          response_file="$RUNNER_TEMP/content-publish-response.json"

          for attempt in 1 2 3 4 5 6; do
            http_code="$(
              curl -sS -L \
                -o "$response_file" \
                -w '%{http_code}' \
                --connect-timeout 10 \
                --max-time 60 \
                -X POST "$SITE_URL/api/content-publish" \
                -H "Authorization: Bearer $CONTENT_PUBLISH_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$body" || true
            )"

            echo "publish_attempt=$attempt http_code=$http_code"
            head -c 1200 "$response_file" || true
            echo

            if [[ "$http_code" =~ ^2 ]]; then
              exit 0
            fi

            if [ "$http_code" = "401" ]; then
              echo "Authorization failed; not retrying." >&2
              exit 1
            fi

            sleep 20
          done

          echo "Content publish did not succeed after retries." >&2
          exit 1
